<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="55%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <circle cx="150" cy="60" r="220" fill="url(#glowCyan)"/>
  <circle cx="1080" cy="260" r="200" fill="url(#glowRed)"/>

  <!-- DNA double helix, right side -->
  <g opacity="0.55" transform="translate(880,20)">
    <path d="M0,0 C40,60 -40,120 0,180 C40,240 -40,280 0,300" stroke="#22d3ee" stroke-width="2.5" fill="none"/>
    <path d="M60,0 C20,60 100,120 60,180 C20,240 100,280 60,300" stroke="#f43f5e" stroke-width="2.5" fill="none" opacity="0.85"/>
    <g stroke="#67e8f9" stroke-width="1.4" opacity="0.6">
      <line x1="4" y1="10" x2="56" y2="10"/>
      <line x1="14" y1="40" x2="46" y2="40"/>
      <line x1="20" y1="70" x2="40" y2="70"/>
      <line x1="10" y1="100" x2="50" y2="100"/>
      <line x1="0" y1="130" x2="60" y2="130"/>
      <line x1="8" y1="160" x2="52" y2="160"/>
      <line x1="18" y1="190" x2="42" y2="190"/>
      <line x1="14" y1="220" x2="46" y2="220"/>
      <line x1="4" y1="250" x2="56" y2="250"/>
      <line x1="10" y1="280" x2="50" y2="280"/>
    </g>
    <g fill="#22d3ee" opacity="0.7">
      <circle cx="4" cy="10" r="3"/><circle cx="56" cy="10" r="3"/>
      <circle cx="0" cy="130" r="3"/><circle cx="60" cy="130" r="3"/>
      <circle cx="4" cy="250" r="3"/><circle cx="56" cy="250" r="3"/>
    </g>
    <g fill="#f43f5e" opacity="0.7">
      <circle cx="14" cy="40" r="3"/><circle cx="46" cy="40" r="3"/>
      <circle cx="8" cy="160" r="3"/><circle cx="52" cy="160" r="3"/>
    </g>
  </g>

  <!-- Title block -->
  <text x="70" y="140" font-family="Georgia, 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="url(#titleGrad)">
    🧬 Genomic Variant
  </text>
  <text x="70" y="200" font-family="Georgia, 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="url(#titleGrad)">
    Intelligence Platform
  </text>
  <text x="72" y="240" font-family="'Courier New', monospace" font-size="17" fill="#94a3b8">
    Autonomous ETL · Ensembl REST API → DuckDB → Live Analytics
  </text>

  <!-- tag pills -->
  <g font-family="'Courier New', monospace" font-size="13" font-weight="600">
    <rect x="72" y="258" width="150" height="28" rx="14" fill="#0e222a" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="88" y="276" fill="#22d3ee">Multi-Species</text>

    <rect x="232" y="258" width="150" height="28" rx="14" fill="#0e222a" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="248" y="276" fill="#22d3ee">Auto-Scheduled</text>

    <rect x="392" y="258" width="140" height="28" rx="14" fill="#2a1420" stroke="#f43f5e" stroke-opacity="0.5"/>
    <text x="408" y="276" fill="#fb7185">Self-Healing ETL</text>
  </g>
</svg>