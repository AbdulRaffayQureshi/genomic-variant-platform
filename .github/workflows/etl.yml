name: Daily Genomic ETL Pipeline

# The 'on' block defines the triggers (when this runs)
on:
  schedule:
    # Runs at 04:00 UTC every day (which is 9:00 AM PKT)
    - cron: '0 4 * * *'
  workflow_dispatch: # This adds a manual "Run Workflow" button in the GitHub UI

jobs:
  run-etl:
    runs-on: ubuntu-latest # GitHub provides a fresh Ubuntu Linux server
    
    # CRITICAL: This permission is required for the bot to push code back to your repo
    permissions:
      contents: write 

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v3

      - name: 🐍 Set up Python
        run: uv python install 3.10

      - name: 📦 Install dependencies
        run: |
          uv venv
          uv pip install requests pandas duckdb streamlit plotly pydantic

      - name: 🚀 Run ETL Pipeline
        run: |
          mkdir -p data/processed
          source .venv/bin/activate
          python3 src/pipeline.py
          
      # Cloud servers are ephemeral (they delete themselves when finished).
      # We upload the DuckDB database as an "artifact" so you can download the 
      # fresh data after the pipeline finishes.
      - name: 💾 Save Database as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genomic-database
          path: data/processed/genomic_data.duckdb
          retention-days: 7

      # NEW: This commits the fresh database back to your main branch
      # so your Streamlit Community Cloud app can actually use it.
      - name: 🔄 Commit updated DuckDB database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily refresh of genomic DuckDB cache"
          file_pattern: "data/processed/*.duckdb"